# Publish the portfolio page to GitHub Pages.
# outputs/briefs/will_it_travel_portfolio.html is served as the site's home page (index.html).
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["outputs/briefs/will_it_travel_portfolio.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (portfolio page -> index.html)
        run: |
          mkdir -p _site
          cp outputs/briefs/will_it_travel_portfolio.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
